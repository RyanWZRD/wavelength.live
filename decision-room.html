<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision Room — Wavelength</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="customer-os.css?v=20260908-today-v2"><script src="shared-nav.js?v=20260908-today-v2" defer></script><script src="wavelength-os.js?v=20260908-os1" defer></script><style>
body.wl-customer-os .dr-page{display:grid;gap:12px}.dr-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,.5fr);gap:12px}.dr-title{font:800 clamp(34px,4vw,62px) 'Bricolage Grotesque',sans-serif;line-height:1;margin:4px 0 8px}.dr-sub{color:#93a4b8;font-size:13px;line-height:1.6}.dr-boundary{margin-top:11px;padding-top:10px;border-top:1px solid #273448;color:#8092a7;font:500 9px 'IBM Plex Mono',monospace}.dr-select{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.dr-select select{min-width:140px}.dr-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.dr-kpi{padding:11px;border:1px solid #2b3c50;border-radius:9px;background:#09131e}.dr-kpi span{display:block;color:#8193a8;font:700 8px 'IBM Plex Mono',monospace;text-transform:uppercase}.dr-kpi b{display:block;margin-top:5px;font:800 17px 'IBM Plex Mono',monospace}.dr-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dr-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dr-list{display:grid;gap:8px;margin-top:10px}.dr-evidence{padding:10px;border:1px solid #2a3b4f;border-radius:8px;background:#08121c;border-left:3px solid #55c98a}.dr-evidence.object{border-left-color:#d6a44c}.dr-evidence b{display:block;font-size:11px}.dr-evidence span{display:block;margin-top:4px;color:#8799ad;font-size:9px;line-height:1.45}.dr-committee{width:100%;border-collapse:collapse}.dr-committee th,.dr-committee td{padding:9px;border-bottom:1px solid #263648;text-align:left;font-size:10px}.dr-committee th{color:#7f91a6;font:700 8px 'IBM Plex Mono',monospace;text-transform:uppercase}.dr-scenario{padding:12px;border:1px solid #2b3b50;border-radius:9px;background:#09131d}.dr-scenario h3{margin:0 0 7px;font:800 12px 'IBM Plex Mono',monospace}.dr-scenario p{margin:0;color:#a8b7c8;font-size:10px;line-height:1.55}.dr-proof-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.dr-proof-stat{padding:10px;border:1px solid #2b3d52;border-radius:8px;background:#08121c}.dr-proof-stat span{display:block;color:#7f91a6;font:700 8px 'IBM Plex Mono',monospace;text-transform:uppercase}.dr-proof-stat b{display:block;margin-top:5px;font:800 15px 'IBM Plex Mono',monospace}.dr-call{padding:9px;border:1px solid #28394d;border-radius:8px;background:#08121c;color:#aab9ca;font-size:10px;line-height:1.5}.dr-fit{padding:12px;border-left:3px solid #5b86c6;background:#08121c;border-radius:7px}.dr-fit.good{border-left-color:#55c98a}.dr-fit.warn{border-left-color:#d6a44c}.dr-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.dr-condition{padding:10px;border-left:3px solid #5b86c6;background:#08121c;border-radius:6px;color:#aab9ca;font-size:10px;line-height:1.5}@media(max-width:1050px){.dr-hero,.dr-grid2{grid-template-columns:1fr}.dr-kpis{grid-template-columns:repeat(3,1fr)}.dr-grid3{grid-template-columns:1fr}.dr-proof-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.dr-kpis,.dr-proof-grid{grid-template-columns:1fr}}</style></head><body class="wl-customer-os"><div class="page dr-page"><header class="topbar"><a class="brand" href="./"><div class="brand-mark">〰</div><div><div class="brand-name">Wavelength</div><div class="brand-sub">DECISION ROOM</div></div></a><nav class="nav"></nav><span class="status-pill ok"><span class="dot"></span>GROUNDED READ</span></header><main id="app"><section class="card"><div class="empty">Building Decision Room…</div></section></main><footer class="footer">Decision Room combines current research evidence, frozen proof and browser-local portfolio context. It has no trade or capital-allocation authority.</footer></div><script>window.addEventListener('DOMContentLoaded',async()=>{while(!window.WavelengthOS)await new Promise(r=>setTimeout(r,20));const W=WavelengthOS,app=document.getElementById('app');const get=async p=>W.get(p)||{},esc=W.esc,num=W.num,fmt=v=>num(v)==null?'—':`${num(v)>=0?'+':''}${num(v).toFixed(2)}%`;const [assurance,radar,journal]=await Promise.all([W.assurance(),get('opportunity-radar.json'),get('decision-journal.json')]);const assets=Array.isArray(assurance.assets)?assurance.assets:[],opps=Array.isArray(radar.opportunities)?radar.opportunities:[],records=Array.isArray(journal.records)?journal.records:[];const params=new URLSearchParams(location.search),requested=(params.get('symbol')||'BTC').toUpperCase(),available=[...new Set([...assets.map(a=>a.symbol),...opps.map(o=>o.symbol)].filter(Boolean).map(x=>String(x).toUpperCase()))].sort();const by=s=>assets.find(a=>String(a.symbol).toUpperCase()===s),opp=s=>opps.find(o=>String(o.symbol).toUpperCase()===s),exact4=r=>num(r?.exact_outcomes?.['4h']);const holdings=()=>W.holdings();function portfolioSnapshot(list){const total=list.reduce((s,h)=>s+Number(h.value||0),0),largest=[...list].sort((a,b)=>Number(b.value||0)-Number(a.value||0))[0],weighted=total?list.reduce((s,h)=>{const a=by(String(h.symbol).toUpperCase());return s+Number(h.value||0)*(a?W.score(a):50)},0)/total:null;return{total,largest,max:total&&largest?Number(largest.value||0)/total*100:0,weighted}}function selectHtml(sym){return`<div class="dr-select"><span class="wl-os-muted">Asset</span><select id="drAsset" class="wl-os-select">${available.map(s=>`<option ${s===sym?'selected':''}>${esc(s)}</option>`).join('')}</select><a class="wl-os-btn" href="discover.html">Back to Discover</a></div>`}async function render(sym){const a=by(sym),o=opp(sym);if(!a){app.innerHTML=`<section class="card"><h1>Decision Assurance coverage unavailable for ${esc(sym)}</h1>${selectHtml(sym)}<p class="wl-os-muted">Opportunity Radar may still surface this asset, but the Decision Room requires current evidence decomposition.</p></section>`;bind();return}const ec=a.evidence_confidence||{},q=W.quality(a),comm=W.committee(a),pos=W.positives(a),neg=W.objections(a),cf=a.counterfactual||{},support=comm.filter(x=>x.vote==='SUPPORT').length,watch=comm.filter(x=>x.vote==='WATCH').length,object=comm.filter(x=>x.vote==='OBJECT').length,changes=a.decision_decomposition?.what_would_change_the_decision||[];const rs=records.filter(r=>String(r.symbol||'').toUpperCase()===sym),resolved=rs.map(exact4).filter(v=>v!=null),avg=resolved.length?resolved.reduce((x,y)=>x+y,0)/resolved.length:null,posRate=resolved.length?resolved.filter(v=>v>0).length/resolved.length*100:null,recent=rs.slice().sort((x,y)=>Date.parse(y.at||0)-Date.parse(x.at||0)).slice(0,4);const hs=holdings(),before=portfolioSnapshot(hs),owned=hs.find(h=>String(h.symbol).toUpperCase()===sym),assumed=before.total?before.total*.1:0,next=hs.filter(h=>String(h.symbol).toUpperCase()!==sym),candidateValue=Number(owned?.value||0)+assumed;if(before.total&&assumed){next.push({symbol:sym,value:candidateValue})}const after=before.total?portfolioSnapshot(next):null,delta=before.weighted!=null&&after?.weighted!=null?after.weighted-before.weighted:null,share=after?.total?candidateValue/after.total*100:null;let fitClass='warn',fitTitle='Portfolio context unavailable',fitText='Add holdings in My Portfolio to test how this asset changes concentration and evidence quality.';if(before.total){if(delta>1&&after.max<=before.max+5){fitClass='good';fitTitle='Research fit improves';fitText=`A 10%-of-current-value illustrative addition would move weighted evidence ${before.weighted.toFixed(1)} → ${after.weighted.toFixed(1)} and largest-position concentration ${before.max.toFixed(1)}% → ${after.max.toFixed(1)}%.`}else{fitTitle='Portfolio trade-off';fitText=`Illustrative addition produces evidence ${before.weighted?.toFixed(1)??'—'} → ${after.weighted?.toFixed(1)??'—'} and concentration ${before.max.toFixed(1)}% → ${after.max.toFixed(1)}%. No diversification benefit is inferred without measured correlation evidence.`}}const opportunity=o?.canonical_score??'—',stage=o?.stage||'not surfaced',priceMove=o?.change_24h;app.innerHTML=`<section class="dr-hero"><div class="card"><div class="wl-os-kicker">Decision dossier · ${esc(sym)}</div><h1 class="dr-title">${esc(sym)} <span class="wl-os-warn">${esc(ec.grade||'—')}</span></h1><div class="dr-sub">Wavelength separates <b>evidence quality</b> from <b>current opportunity priority</b>. This page shows both, plus the objections, historical record and portfolio context.</div>${selectHtml(sym)}<div class="dr-actions"><a class="wl-os-btn primary" href="asset.html?symbol=${encodeURIComponent(sym)}">Open live asset</a><a class="wl-os-btn" href="ask-wavelength.html?q=${encodeURIComponent('Why '+sym+'?')}">Ask Wavelength</a><a class="wl-os-btn" href="proof-ledger.html">Open Proof</a><a class="wl-os-btn" href="replay.html?symbol=${encodeURIComponent(sym)}">Replay</a></div><div class="dr-boundary">Opportunity and evidence scores are ranking tools, not probabilities of profit. Historical outcomes are observational evidence and do not grant trading permission.</div></div><div class="card"><div class="wl-os-kicker">Committee balance</div><div class="dr-grid3" style="margin-top:10px"><div class="dr-kpi"><span>Support</span><b class="wl-os-good">${support}</b></div><div class="dr-kpi"><span>Watch</span><b class="wl-os-warn">${watch}</b></div><div class="dr-kpi"><span>Object</span><b class="wl-os-bad">${object}</b></div></div><div class="wl-os-muted" style="margin-top:10px">Evidence desks vote on source quality and current evidence strength, not expected return.</div></div></section><section class="dr-kpis"><div class="dr-kpi"><span>Opportunity</span><b>${esc(opportunity)}/100</b></div><div class="dr-kpi"><span>Opportunity stage</span><b>${esc(stage)}</b></div><div class="dr-kpi"><span>Evidence grade</span><b>${esc(ec.grade||'—')}</b></div><div class="dr-kpi"><span>Evidence quality</span><b>${num(ec.score)!=null?num(ec.score).toFixed(1):'—'}/100</b></div><div class="dr-kpi"><span>Providers</span><b>${esc(ec.independent_provider_count??0)}</b></div><div class="dr-kpi"><span>24h move</span><b>${fmt(priceMove)}</b></div></section><section class="dr-grid2"><div class="card"><div class="card-title">Why Wavelength cares</div><div class="dr-list">${pos.map(x=>`<div class="dr-evidence"><b>${esc(W.title(x.dimension))}</b><span>${esc(x.provider||'provider unavailable')} · ${esc(x.freshness||'unknown')} · quality ${esc(x.quality_score??'—')} · ${esc(x.semantic_class||'')}</span></div>`).join('')||'<div class="wl-os-empty">No positive evidence surfaced.</div>'}</div></div><div class="card"><div class="card-title">Red Team — why this may be wrong</div><div class="dr-list">${neg.map(x=>`<div class="dr-evidence object"><b>${esc(W.title(x.dimension))}</b><span>${esc(x.provider||'provider unavailable')} · ${esc(x.freshness||'unknown')} · quality ${esc(x.quality_score??'—')} · ${esc(x.semantic_class||'')}</span></div>`).join('')||'<div class="wl-os-empty">No objections surfaced.</div>'}</div></div></section><section class="card"><div class="card-head"><div><div class="card-title">Investment Committee</div><div class="card-meta">Independent evidence desks · source-quality votes</div></div></div><div style="overflow:auto;margin-top:8px"><table class="dr-committee"><thead><tr><th>Desk</th><th>Vote</th><th>Evidence score</th><th>Freshness</th><th>Provider</th></tr></thead><tbody>${comm.map(x=>`<tr><td>${esc(x.name)}</td><td class="${x.vote==='SUPPORT'?'wl-os-good':x.vote==='OBJECT'?'wl-os-bad':'wl-os-warn'}"><b>${esc(x.vote)}</b></td><td>${esc(x.score??'—')}</td><td>${esc(x.freshness)}</td><td>${esc(x.provider)}</td></tr>`).join('')}</tbody></table></div></section><section class="dr-grid3"><div class="dr-scenario"><h3>Bull case</h3><p>${esc(cf.bull_case||'Not published.')}</p></div><div class="dr-scenario"><h3>Base case</h3><p>${esc(cf.base_case||'Not published.')}</p></div><div class="dr-scenario"><h3>Bear case</h3><p>${esc(cf.bear_case||'Not published.')}</p></div></section><section class="dr-grid2"><div class="card"><div class="card-head"><div><div class="card-title">Historical proof for ${esc(sym)}</div><div class="card-meta">Frozen server decisions · exact 4h outcomes where resolved</div></div><a class="wl-os-btn" href="proof-ledger.html">Inspect full ledger</a></div><div class="dr-proof-grid"><div class="dr-proof-stat"><span>Frozen calls</span><b>${rs.length}</b></div><div class="dr-proof-stat"><span>Exact 4h resolved</span><b>${resolved.length}</b></div><div class="dr-proof-stat"><span>Mean exact 4h</span><b>${fmt(avg)}</b></div><div class="dr-proof-stat"><span>Positive rate</span><b>${posRate==null?'—':posRate.toFixed(1)+'%'}</b></div></div><div class="dr-list">${recent.length?recent.map(r=>`<div class="dr-call"><b>${esc(r.decision)} · score ${esc(r.score)}/100</b><br>${esc(new Date(r.at).toLocaleString())} · exact 4h ${exact4(r)==null?'UNRESOLVED':fmt(exact4(r))}</div>`).join(''):'<div class="wl-os-empty">No frozen server decisions are stored for this asset yet.</div>'}</div></div><div class="card"><div class="card-head"><div><div class="card-title">Portfolio fit</div><div class="card-meta">Browser-local holdings · illustrative 10% addition</div></div><a class="wl-os-btn" href="portfolio-intelligence.html">Test exact amount</a></div><div class="dr-fit ${fitClass}" style="margin-top:10px"><b>${esc(fitTitle)}</b><div class="wl-os-muted" style="margin-top:5px">${esc(fitText)}</div></div>${before.total?`<div class="dr-proof-grid"><div class="dr-proof-stat"><span>Current portfolio</span><b>£${before.total.toLocaleString(undefined,{maximumFractionDigits:0})}</b></div><div class="dr-proof-stat"><span>${esc(sym)} after test</span><b>${share?.toFixed(1)??'—'}%</b></div><div class="dr-proof-stat"><span>Evidence delta</span><b>${delta==null?'—':(delta>=0?'+':'')+delta.toFixed(1)}</b></div><div class="dr-proof-stat"><span>Already owned</span><b>${owned?'YES':'NO'}</b></div></div>`:''}</div></section><section class="card"><div class="card-head"><div><div class="card-title">What would change Wavelength's mind?</div><div class="card-meta">Explicit current decision conditions</div></div></div><div class="dr-list">${changes.map(x=>`<div class="dr-condition">${esc(x)}</div>`).join('')||'<div class="wl-os-empty">No explicit decision-change conditions are currently published.</div>'}</div><div class="dr-evidence object" style="margin-top:10px"><b>Thesis invalidation</b><span>${esc(cf.thesis_invalidation||'No explicit invalidation is currently published.')}</span></div><div class="dr-actions"><a class="wl-os-btn" href="ask-wavelength.html?q=${encodeURIComponent('What would change '+sym+'?')}">Ask about invalidation</a><a class="wl-os-btn" href="evidence-map.html?symbol=${encodeURIComponent(sym)}">Open Evidence Map</a><a class="wl-os-btn" href="thesis-watch.html?symbol=${encodeURIComponent(sym)}">Add to Thesis Watch</a></div></section>`;bind()}function bind(){const s=document.getElementById('drAsset');if(s)s.onchange=()=>{history.replaceState(null,'',`decision-room.html?symbol=${encodeURIComponent(s.value)}`);render(s.value)}}render(requested)})</script></body></html>
