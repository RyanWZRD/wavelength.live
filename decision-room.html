<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision Room — Wavelength</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="customer-os.css?v=20260908-os1"><script src="shared-nav.js" defer></script><script src="wavelength-os.js?v=20260908-os1" defer></script></head><body><div class="page"><header class="topbar"><a class="brand" href="./"><div class="brand-mark">〰</div><div><div class="brand-name">Wavelength</div><div class="brand-sub">DECISION ROOM</div></div></a><nav class="nav"></nav><span class="status-pill"><span class="dot"></span>READ ONLY</span></header><main id="app"><section class="card"><div class="empty">Building Decision Room…</div></section></main><footer class="footer">Evidence-driven research only. Committee votes describe evidence quality and do not constitute trade authority.</footer></div><script>window.addEventListener('DOMContentLoaded',async()=>{while(!window.WavelengthOS)await new Promise(r=>setTimeout(r,20));const W=WavelengthOS;W.boot();const sym=(W.params().symbol||'BTC').toUpperCase();const a=await W.asset(sym);const app=document.getElementById('app');if(!a){app.innerHTML='<section class="card"><h1>Asset not found</h1><a class="wl-os-btn" href="discover.html">Back to Discover</a></section>';return}const ec=a.evidence_confidence||{},q=W.quality(a),comm=W.committee(a),pos=W.positives(a),neg=W.objections(a),cf=a.counterfactual||{};const support=comm.filter(x=>x.vote==='SUPPORT').length,object=comm.filter(x=>x.vote==='OBJECT').length,watch=comm.filter(x=>x.vote==='WATCH').length;app.innerHTML=`<section class="wl-os-hero"><div class="card"><div class="wl-os-kicker">Decision Room · ${W.esc(sym)}</div><h1 class="wl-os-title">${W.esc(sym)} <span class="wl-os-warn">${W.esc(ec.grade||'—')}</span></h1><div class="wl-os-sub">Evidence confidence ${W.esc(ec.score??'—')}/100 · ${W.esc(q.direct??0)} direct · ${W.esc(q.proxy??0)} proxy · ${W.esc(ec.independent_provider_count??0)} independent providers${ec.provisional?' · PROVISIONAL':''}</div><div class="wl-os-actionbar" style="margin-top:14px"><a class="wl-os-btn primary" href="asset.html?symbol=${encodeURIComponent(sym)}">Open live asset</a><a class="wl-os-btn" href="ask-wavelength.html?q=${encodeURIComponent('Why '+sym+'?')}">Ask Wavelength</a><a class="wl-os-btn" href="replay.html?symbol=${encodeURIComponent(sym)}">Replay history</a></div></div><div class="card"><div class="wl-os-kicker">Committee balance</div><div class="wl-os-grid3" style="margin-top:12px"><div class="wl-os-kpi"><small>Support</small><b class="wl-os-good">${support}</b></div><div class="wl-os-kpi"><small>Watch</small><b class="wl-os-warn">${watch}</b></div><div class="wl-os-kpi"><small>Object</small><b class="wl-os-bad">${object}</b></div></div></div></section><section class="wl-os-grid2"><div class="card"><div class="card-title">Why Wavelength cares</div><div class="wl-os-list" style="margin-top:12px">${pos.map(x=>`<div class="wl-os-thesis"><b>${W.esc(W.title(x.dimension))}</b><div class="wl-os-muted">${W.esc(x.provider)} · ${W.esc(x.freshness)} · quality ${W.esc(x.quality_score)}</div></div>`).join('')||'<div class="wl-os-empty">No positive evidence surfaced.</div>'}</div></div><div class="card"><div class="card-title">Red Team — why this may be wrong</div><div class="wl-os-list" style="margin-top:12px">${neg.map(x=>`<div class="wl-os-objection"><b>${W.esc(W.title(x.dimension))}</b><div class="wl-os-muted">${W.esc(x.provider)} · ${W.esc(x.semantic_class)} · quality ${W.esc(x.quality_score)}</div></div>`).join('')||'<div class="wl-os-empty">No objections surfaced.</div>'}</div></div></section><section class="card"><div class="card-title">Investment Committee</div><div style="overflow:auto;margin-top:10px"><table class="wl-os-table"><thead><tr><th>Desk</th><th>Vote</th><th>Evidence</th><th>Freshness</th><th>Provider</th></tr></thead><tbody>${comm.map(x=>`<tr><td>${W.esc(x.name)}</td><td class="${x.vote==='SUPPORT'?'wl-os-good':x.vote==='OBJECT'?'wl-os-bad':'wl-os-warn'}">${W.esc(x.vote)}</td><td>${W.esc(x.score??'—')}</td><td>${W.esc(x.freshness)}</td><td>${W.esc(x.provider)}</td></tr>`).join('')}</tbody></table></div></section><section class="wl-os-grid3"><div class="card"><div class="card-title">Bull case</div><p class="wl-os-muted">${W.esc(cf.bull_case||'Not available.')}</p></div><div class="card"><div class="card-title">Base case</div><p class="wl-os-muted">${W.esc(cf.base_case||'Not available.')}</p></div><div class="card"><div class="card-title">Bear case</div><p class="wl-os-muted">${W.esc(cf.bear_case||'Not available.')}</p></div></section><section class="card"><div class="card-title">What would change our mind?</div><div class="wl-os-list" style="margin-top:10px">${(a.decision_decomposition?.what_would_change_the_decision||[]).map(x=>`<div class="wl-os-proof">${W.esc(x)}</div>`).join('')||'<div class="wl-os-empty">No explicit triggers published.</div>'}</div><div class="wl-os-callout" style="margin-top:12px"><b>Thesis invalidation</b><div class="wl-os-muted" style="margin-top:6px">${W.esc(cf.thesis_invalidation||'Not available.')}</div></div></section>`})</script></body></html>
