name: Decision Integrity v1 contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'decision-integrity-v1.js'
      - 'asset.html'
      - 'research-autopilot-v2.js'
      - 'research.html'
      - '.github/workflows/decision-integrity-v1-check.yml'
  push:
    branches: [main]
    paths:
      - 'decision-integrity-v1.js'
      - 'asset.html'
      - 'research-autopilot-v2.js'
      - 'research.html'
      - '.github/workflows/decision-integrity-v1-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check decision-integrity-v1.js
          node --check research-autopilot-v2.js
      - name: Twelve capability contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          j=Path('decision-integrity-v1.js').read_text()
          h=Path('asset.html').read_text()
          r=Path('research-autopilot-v2.js').read_text()
          rh=Path('research.html').read_text()
          required={
            'multi_source_consensus':'refreshProviderQuotes',
            'counterfactual_analysis':'counterfactuals',
            'evidence_removal_stress':'removalStress',
            'historical_analogue_v2':'historicalAnalogueText',
            'probability_calibration':'calibrationView',
            'baseline_competition':'baselineView',
            'decision_replay':'maybeFreezeReplay',
            'provenance_and_age':'provenanceRows',
            'market_regime':'regimeView',
            'portfolio_contribution':'portfolioContribution',
            'thesis_decay':'thesisDecay',
            'adversarial_agent':'adversary',
            'evidence_graph':'evidenceGraph',
            'research_autopilot':'autopilot',
          }
          for name,token in required.items():
              assert token in j, f'{name}: {token}'
          assert 'decision-integrity-v1.js?v=20260907-di12-1' in h
          assert 'research-autopilot-v2.js?v=20260907-autopilot2-1' in rh
          assert 'research-autopilot-v2.json' in r
          for forbidden in ['submit_order','submit_market_order','TradingClient','/v2/orders','automatic_promotion:true','orders_enabled:true']:
              assert forbidden not in j, forbidden
              assert forbidden not in r, forbidden
          for guard in ['NO ORDERS','NO AUTO-PROMOTION','NO RULE MUTATION']:
              assert guard in j, guard
          print('Decision Integrity v1 + all twelve ambitious capabilities locked')
          PY
