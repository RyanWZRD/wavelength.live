name: Wavelength Terminal UI v1

on:
  pull_request:
    paths:
      - 'terminal-shell.css'
      - 'terminal-shell.js'
      - 'live-market-repaint.js'
      - 'live-market-repaint-loader.js'
      - 'shared-nav.js'
      - 'platform-hardening.css'
      - 'conviction-room.html'
      - 'market-command.html'
      - 'data-truth-v4.html'
      - 'asset.html'
      - 'index.html'
      - '.github/workflows/terminal-ui-v1.yml'
  push:
    branches: [main]
    paths:
      - 'terminal-shell.css'
      - 'terminal-shell.js'
      - 'live-market-repaint.js'
      - 'live-market-repaint-loader.js'
      - 'shared-nav.js'
      - 'platform-hardening.css'
      - 'conviction-room.html'
      - 'market-command.html'
      - 'data-truth-v4.html'
      - 'asset.html'
      - 'index.html'
      - '.github/workflows/terminal-ui-v1.yml'

jobs:
  terminal-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify terminal shell, unfrozen workspace and live market repaint
        run: |
          node --check live-market-repaint.js
          node --check live-market-repaint-loader.js
          python - <<'PY'
          from pathlib import Path
          css=Path('terminal-shell.css').read_text()
          js=Path('terminal-shell.js').read_text()
          live=Path('live-market-repaint.js').read_text()
          loader=Path('live-market-repaint-loader.js').read_text()
          nav=Path('shared-nav.js').read_text()
          hard=Path('platform-hardening.css').read_text()
          cr=Path('conviction-room.html').read_text()
          index=Path('index.html').read_text()
          for marker in ['wl-terminal-v1','wlt-strip','wlt-rail','wlt-commandline','--term-accent']:
              assert marker in css
          for marker in ["'market-command.html'","'data-truth-v4.html'","'conviction-room.html'","'asset.html'",'F1','F5','WL&gt;','MODE RESEARCH-ONLY']:
              assert marker in js
          for marker in ['wss://stream.binance.com:9443/stream?streams=','schedulePaint()','#marketBody tr[data-sym=','.mover[data-open=','setTimeout(flush,120)','lastTickAt']:
              assert marker in live, marker
          assert 'live-market-repaint.js?v=${VERSION}' in loader
          assert 'live-market-repaint-loader.js?v=20260907-1453' in index
          assert "load('live-market-repaint.js','wl-live-market-repaint')" in nav
          assert "style('terminal-shell.css','wl-terminal-shell')" in nav
          assert "load('terminal-shell.js','wl-terminal-shell')" in nav
          assert '.wl-tape{position:relative!important;top:auto!important}' in hard
          assert 'position:sticky' not in css
          assert 'href="styles.css"' in cr and 'href="style.css"' not in cr
          print('Wavelength Terminal UI v1 + direct visible live price regression checks passed')
          PY
