name: Platform hardening UI checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'source-manifest.json'
      - 'provenance*'
      - 'activity*'
      - 'workspace-ui.js'
      - 'platform-hardening.css'
      - 'command-palette.js'
      - 'shared-nav.js'
      - '.github/workflows/platform-hardening-ui-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check provenance-core.js
          node --check provenance-page.js
          node --check activity.js
          node --check workspace-ui.js
          node --check command-palette.js
          node --check shared-nav.js
      - name: Manifest and required surfaces
        run: |
          node -e "JSON.parse(require('fs').readFileSync('source-manifest.json','utf8'))"
          test -s provenance.html
          test -s activity.html
          test -s platform-hardening.css
          grep -q 'CANONICAL_GOVERNANCE' source-manifest.json
          grep -q 'WAVELENGTH_PUBLIC_SOURCE_MANIFEST_V2_READ_ONLY' source-manifest.json
          grep -q 'transitive' source-manifest.json
          grep -q 'dependencies' source-manifest.json
          grep -q 'observed_at_paths' source-manifest.json
          grep -q "fresh_generated_from_stale_upstream" source-manifest.json
          for state in FRESH AGING STALE DEGRADED MISSING CONFLICT; do grep -q "$state" source-manifest.json; done
          grep -q 'effective_state' provenance-core.js
          grep -q 'lineage' provenance-core.js
          grep -q 'observed_at' provenance-core.js
          grep -q 'generated_at' provenance-core.js
          grep -q 'Scheduled/source freshness SLA breached' provenance-core.js
          grep -q 'Event-driven source has not regenerated' provenance-core.js
          grep -q 'activity.html' shared-nav.js
          grep -q 'provenance.html' shared-nav.js
          grep -q 'provenance-core.js' shared-nav.js
          grep -q 'workspace-ui.js' shared-nav.js
          grep -q 'strategy_rule_mutation' source-manifest.json
          grep -q 'execution_authority' source-manifest.json
          grep -q 'Browser-local preferences only' workspace-ui.js
          grep -q 'Activity is observational evidence' activity.html
          grep -q 'This layer is observability only' provenance.html
