name: Update bot status

on:
  schedule:
    - cron: '5 * * * *'   # hourly, 5 minutes past the hour
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too
  push:
    paths:
      - '.github/workflows/bot-status.yml'

permissions:
  contents: write

concurrency:
  group: update-bot-status-main
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python update_status.py
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}

      - name: Commit and push if changed
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_status() {
            git add bot-status.json
            if git diff --staged --quiet; then
              return 1
            fi
            git commit -m "Update bot status"
            return 0
          }

          commit_status || exit 0

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Bot status push succeeded on attempt ${attempt}"
                exit 0
              fi
            else
              echo "Rebase conflict on attempt ${attempt}; rebuilding status from latest main"
              git rebase --abort || true
            fi

            git reset --hard origin/main
            python update_status.py
            if ! commit_status; then
              echo "Latest main already contains equivalent bot status"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Bot status push failed after retries' >&2
          exit 1
