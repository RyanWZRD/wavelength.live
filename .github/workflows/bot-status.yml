name: Update bot status

on:
  schedule:
    - cron: '5 * * * *'   # hourly, 5 minutes past the hour
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too
  push:
    branches: [main]
    paths:
      - '.github/workflows/bot-status.yml'

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python update_status.py
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot-status.json
          git diff --staged --quiet || git commit -m "Update bot status"
          git push
