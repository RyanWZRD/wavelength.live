name: Wavelength Live site checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - '*.json'
      - '*.webmanifest'
      - '*.svg'
      - '.github/workflows/site-check.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check coin.js
          node --check coin-intelligence.js
          node --check coin-terminal.js
          node --check coin-history.js
          node --check coin-outcomes.js
          node --check opportunity-centre.js
          node --check strategies.js
          node --check bot.js
          node --check bot-ops.js
          node --check bot-first-trade.js
          node --check pre-trade-evidence.js
          node --check auto-paper-ui.js
          node --check manual-v3-close-ui.js
          node --check learning.js
          node --check learning-capture.js
          node --check server-learning.js
          node --check paper.js
          node --check cockpit-v2.js
          node --check cockpit-pro.js
          node --check funnel-drilldown.js
          node --check observation-experience.js
          node --check research.js
          node --check radar-intel.js
          node --check research-v3.js
          node --check research-intelligence.js
          node --check candidate-v3-forward-evidence.js
          node --check strategy-factory-v3.js
          node --check execution-intelligence.js
          node --check controlled-paper-portfolio.js
          node --check adaptive-allocation.js
          node --check portfolio-validation-trials.js
          node --check shared-nav.js
          node --check governance.js
          node --check terminal-ui.js
          node --check final-ui.js
          node --check compare.js
          node --check sw.js
          node --check schema-smoke.js
      - name: Runtime feed schema smoke
        run: node schema-smoke.js
      - name: Assert required cockpit files
        run: |
          test -s index.html
          test -s coin.html
          test -s coin.js
          test -s coin-intelligence.js
          test -s coin-terminal.js
          test -s coin-history.js
          test -s coin-outcomes.js
          test -s opportunity-centre.html
          test -s opportunity-centre.js
          test -s learning.html
          test -s paper.html
          test -s paper.js
          test -s paper-portfolio.json
          test -s paper-accounting.json
          test -s paper-history.json
          test -s opportunity-radar.json
          test -s opportunity-funnel.json
          test -s observation-status.json
          test -s observation-experience.js
          test -s cockpit-v2.js
          test -s cockpit-pro.js
          test -s funnel-drilldown.js
          test -s research.html
          test -s research.js
          test -s radar-intel.js
          test -s research-v3.js
          test -s research-intelligence.js
          test -s candidate-v3-forward-evidence.js
          test -s candidate-v3-forward-evidence.json
          test -s strategy-factory-v3.js
          test -s strategy-factory-v3.json
          test -s execution-intelligence.js
          test -s execution-intelligence.json
          test -s controlled-paper-portfolio.js
          test -s controlled-paper-portfolio.json
          test -s adaptive-allocation.js
          test -s adaptive-allocation.json
          test -s portfolio-validation-trials.js
          test -s portfolio-validation-trials.json
          test -s research-evidence.json
          test -s governance.html
          test -s governance.js
          test -s compare.html
          test -s compare.js
          test -s terminal-ui.js
          test -s final-ui.js
          test -s mobile.html
          test -s manifest.webmanifest
          test -s wavelength-icon.svg
          test -s sw.js
          test -s shared-nav.js
          test -s strategies.html
          test -s bot.html
          test -s bot-ops.js
          test -s bot-first-trade.js
          test -s pre-trade-evidence.js
          test -s auto-paper-ui.js
          test -s manual-v3-close-ui.js
          test -s automatic-paper-status.json
          test -s multi-asset-paper-status.json
          test -s paper-ops-status.json
          test -s bot-operations-status.json
          test -s styles.css
          test -s validation.json
          test -s server-learning.js
          test -s schema-smoke.js
      - name: Assert shared navigation wiring
        run: |
          grep -q 'shared-nav.js' index.html
          grep -q 'funnel-drilldown.js' index.html
          grep -q 'observation-experience.js' shared-nav.js
          grep -q 'opportunity-centre.html' shared-nav.js
          grep -q 'shared-nav.js' opportunity-centre.html
          grep -q 'opportunity-centre.js' opportunity-centre.html
          grep -q 'Opportunity Centre ≠ trading permission' opportunity-centre.html
          grep -q 'opportunity-radar.json' opportunity-centre.js
          grep -q 'Research context only' opportunity-centre.js
          grep -q 'shared-nav.js' paper.html
          grep -q 'shared-nav.js' research.html
          grep -q 'research-intelligence.js' research.html
          grep -q 'research-intelligence.json' research-intelligence.js
          grep -q 'candidate-v3-forward-evidence.js' research.html
          grep -q 'candidate-v3-forward-evidence.json' candidate-v3-forward-evidence.js
          grep -q 'strategy-factory-v3.js' research.html
          grep -q 'strategy-factory-v3.json' strategy-factory-v3.js
          grep -q 'execution-intelligence.js' research.html
          grep -q 'execution-intelligence.json' execution-intelligence.js
          grep -q 'controlled-paper-portfolio.js' research.html
          grep -q 'controlled-paper-portfolio.json' controlled-paper-portfolio.js
          grep -q 'adaptive-allocation.js' research.html
          grep -q 'adaptive-allocation.json' adaptive-allocation.js
          grep -q 'portfolio-validation-trials.js' research.html
          grep -q 'portfolio-validation-trials.json' portfolio-validation-trials.js
          grep -q 'shared-nav.js' governance.html
          grep -q 'shared-nav.js' learning.html
          grep -q 'shared-nav.js' strategies.html
          grep -q 'shared-nav.js' bot.html
          grep -q 'bot-ops.js' bot.html
          grep -q 'bot-first-trade.js' bot.html
          grep -q 'pre-trade-evidence.js' bot.html
          grep -q 'auto-paper-ui.js' bot.html
          grep -q 'manual-v3-close-ui.js' bot.html
          grep -q 'manual-candidate-v3-paper-close.yml' manual-v3-close-ui.js
          grep -q 'MANUAL_USER_CLOSE' manual-v3-close-ui.js
          grep -q 'multi-asset-paper-status.json' auto-paper-ui.js
          grep -q 'paper-ops-status.json' auto-paper-ui.js
          grep -q 'shared-nav.js' coin.html
          grep -q 'coin-intelligence.js' coin.html
          grep -q 'coin-terminal.js' coin.html
          grep -q 'Multi-timeframe regime' coin-terminal.js
          grep -q 'Historical analogue explorer' coin-terminal.js
          grep -q 'Strategy permission boundary' coin-terminal.js
          grep -q 'CONTEXT ONLY · NO STRATEGY RULE CHANGES' coin-terminal.js
          grep -q 'shared-nav.js' compare.html
          grep -q 'shared-nav.js' mobile.html
          grep -q 'shared-nav.js' learning-capture.js
          grep -q 'governance.html' shared-nav.js
          grep -q 'compare.html' shared-nav.js
          grep -q 'mobile.html' shared-nav.js
          grep -q 'terminal-ui.js' shared-nav.js
          grep -q 'final-ui.js' shared-nav.js
