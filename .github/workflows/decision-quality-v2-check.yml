name: Decision Quality v2 frontend check

on:
  pull_request:
    paths:
      - 'research-decision-quality-v2.js'
      - 'asset-decision-quality-v2.js'
      - 'asset-chart-priority.js'
      - 'research.html'
      - '.github/workflows/decision-quality-v2-check.yml'
  push:
    branches: [main]
    paths:
      - 'research-decision-quality-v2.js'
      - 'asset-decision-quality-v2.js'
      - 'asset-chart-priority.js'
      - 'research.html'
      - '.github/workflows/decision-quality-v2-check.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and capability surface
        run: |
          node --check research-decision-quality-v2.js
          node --check asset-decision-quality-v2.js
          node --check asset-chart-priority.js
          python - <<'PY'
          from pathlib import Path
          r=Path('research-decision-quality-v2.js').read_text()
          a=Path('asset-decision-quality-v2.js').read_text()
          p=Path('asset-chart-priority.js').read_text()
          h=Path('research.html').read_text()
          for token in ['dqRanking','dqAlerts','dqMissed','dqRelative','research_scorecard','relative_strength_matrix']:
              assert token in r,token
          for token in ['Historical Replay Lab','replayCanvas','replayWhen','replayNext','replayPlay','impact_bps','Decision Quality context']:
              assert token in a,token
          assert 'asset-decision-quality-v2.js?v=20260907-dq2-1' in p
          assert 'research-decision-quality-v2.js?v=20260907-dq2-1' in h
          src=r+a
          for bad in ['submit_order','TradingClient','/v2/orders','automatic_promotion:true']:
              assert bad not in src,bad
          print('Decision Quality v2 frontend + historical replay contract passed')
          PY
