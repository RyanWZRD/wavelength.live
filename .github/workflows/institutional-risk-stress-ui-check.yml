name: Institutional risk stress UI checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'institutional-risk-stress.js'
      - 'institutional-risk-stress.json'
      - 'portfolio-validation-trials.js'
      - '.github/workflows/institutional-risk-stress-ui-check.yml'
  push:
    branches: [main]
    paths:
      - 'institutional-risk-stress.js'
      - 'institutional-risk-stress.json'
      - 'portfolio-validation-trials.js'
      - '.github/workflows/institutional-risk-stress-ui-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and wiring
        run: |
          node --check institutional-risk-stress.js
          node --check portfolio-validation-trials.js
          test -s institutional-risk-stress.json
          grep -q 'institutional-risk-stress.js' portfolio-validation-trials.js
          grep -q 'institutional-risk-stress.json' institutional-risk-stress.js
          grep -q 'NO AUTHORITY' institutional-risk-stress.js
