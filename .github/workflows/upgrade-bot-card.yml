name: Upgrade Wavelength bot card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-bot-card.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade bot card to show forward-test brain
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_constants = '''  const BOT_STATUS_URL = "./bot-status.json";
          const BOT_STATUS_POLL_MS = 60000;

          let botStatus = null;'''
          new_constants = '''  const BOT_STATUS_URL = "./bot-status.json";
          const BOT_BRAIN_URL = "./bot-brain.json";
          const BOT_STATUS_POLL_MS = 60000;

          let botStatus = null;
          let botBrain = null;'''
          if old_constants not in text:
              raise SystemExit('Could not find bot status constants block')
          text = text.replace(old_constants, new_constants, 1)

          replacement = r'''  async function fetchBotStatus(){
            const stamp = Date.now();
            const [statusResult, brainResult] = await Promise.allSettled([
              fetch(BOT_STATUS_URL + "?t=" + stamp).then(res=>{
                if (!res.ok) throw new Error("status " + res.status);
                return res.json();
              }),
              fetch(BOT_BRAIN_URL + "?t=" + stamp).then(res=>{
                if (!res.ok) throw new Error("brain " + res.status);
                return res.json();
              })
            ]);
            if (statusResult.status === "fulfilled") botStatus = statusResult.value;
            if (brainResult.status === "fulfilled") botBrain = brainResult.value;
            renderBotStatus();
          }

          function renderBotStatus(){
            const badge = document.getElementById("botBadge");
            const meta = document.getElementById("botMeta");
            const body = document.getElementById("botBody");

            if (!botStatus && !botBrain){
              body.innerHTML = '<div class="chart-loading">Bot status unavailable right now.</div>';
              return;
            }

            const symbol = (botBrain && botBrain.symbol) || (botStatus && botStatus.symbol) || "ETH/USD";
            const statusTime = (botBrain && botBrain.updated_at) || (botStatus && botStatus.updated_at);
            const asOf = statusTime ? new Date(statusTime).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}) : "—";

            if (botBrain){
              const action = botBrain.action || "UNKNOWN";
              const labels = {
                NO_SIGNAL:"NO SIGNAL",
                WOULD_ENTER:"WOULD BUY",
                WOULD_EXIT:"WOULD EXIT",
                HOLD:"HOLD",
                ENTERED:"ENTERED",
                EXIT:"EXIT"
              };
              badge.textContent = labels[action] || action.replaceAll("_"," ");
              badge.className = "badge " + (action === "WOULD_ENTER" || action === "HOLD" ? "long" : "flat");
              meta.textContent = `${symbol} · forward test · last scan ${asOf} · DRY RUN`;

              const accountEquity = botStatus && botStatus.equity != null ? priceCell(botStatus.equity) : "—";
              const cash = botStatus && botStatus.cash != null ? priceCell(botStatus.cash) : "—";
              const positionText = botStatus && botStatus.position ? "LONG" : "FLAT";
              const adxOk = Number(botBrain.adx) >= 35;
              const rsiOk = Number(botBrain.rsi) >= 50 && Number(botBrain.rsi) <= 75;

              body.innerHTML = `
                <div class="bot-flat-msg"><strong>Forward testing:</strong> Wavelength is analysing each completed 4-hour ETH candle. Automated order execution is currently disabled.</div>
                <div class="bot-grid" style="margin-top:8px;">
                  <div class="bot-tile"><div class="b-label">Decision</div><div class="b-value">${labels[action] || action}</div></div>
                  <div class="bot-tile"><div class="b-label">ADX / trend strength</div><div class="b-value ${adxOk?'up':'flat'}">${botBrain.adx!=null?Number(botBrain.adx).toFixed(1):'—'} ${adxOk?'✓':''}</div></div>
                  <div class="bot-tile"><div class="b-label">RSI / momentum</div><div class="b-value ${rsiOk?'up':'flat'}">${botBrain.rsi!=null?Number(botBrain.rsi).toFixed(1):'—'} ${rsiOk?'✓':''}</div></div>
                  <div class="bot-tile"><div class="b-label">ATR volatility</div><div class="b-value">${botBrain.atr_pct!=null?Number(botBrain.atr_pct).toFixed(2)+'%':'—'}</div></div>
                  <div class="bot-tile"><div class="b-label">Strategy candle close</div><div class="b-value">${priceCell(botBrain.close)}</div></div>
                  <div class="bot-tile"><div class="b-label">Paper account equity</div><div class="b-value">${accountEquity}</div></div>
                  <div class="bot-tile"><div class="b-label">Paper cash</div><div class="b-value">${cash}</div></div>
                  <div class="bot-tile"><div class="b-label">Alpaca position</div><div class="b-value">${positionText}</div></div>
                </div>`;
              return;
            }

            meta.textContent = `${symbol} · account status as of ${asOf} (refreshes hourly)`;
            if (!botStatus.position){
              badge.textContent = "FLAT"; badge.className = "badge flat";
              body.innerHTML = `
                <div class="bot-flat-msg">No open position. Strategy status is temporarily unavailable, but the Alpaca account connection is healthy.</div>
                <div class="bot-grid" style="margin-top:8px;">
                  <div class="bot-tile"><div class="b-label">Account equity</div><div class="b-value">${priceCell(botStatus.equity)}</div></div>
                  <div class="bot-tile"><div class="b-label">Cash</div><div class="b-value">${priceCell(botStatus.cash)}</div></div>
                </div>`;
              return;
            }

            badge.textContent = "LONG"; badge.className = "badge long";
            const p = botStatus.position;
            const live = coins[BOT_SYMBOL];
            const currentPrice = live ? live.price : p.entry_price;
            const pnl = (currentPrice - p.entry_price) * p.qty;
            const pnlPct = (currentPrice / p.entry_price - 1) * 100;
            const pnlCls = pnl>0?"up":pnl<0?"down":"flat";
            body.innerHTML = `
              <div class="bot-grid">
                <div class="bot-tile"><div class="b-label">Position</div><div class="b-value">${p.qty.toFixed(4)} ${symbol.split("/")[0]}</div></div>
                <div class="bot-tile"><div class="b-label">Entry price</div><div class="b-value">${priceCell(p.entry_price)}</div></div>
                <div class="bot-tile"><div class="b-label">Current price</div><div class="b-value" id="botCurrentPrice">${priceCell(currentPrice)}</div></div>
                <div class="bot-tile"><div class="b-label">Unrealized P&amp;L (live)</div><div class="b-value ${pnlCls}" id="botPnl">${priceCell(pnl)} (${fmtPct(pnlPct)})</div></div>
                <div class="bot-tile"><div class="b-label">Stop-loss</div><div class="b-value">${p.stop_price?priceCell(p.stop_price):"—"}</div></div>
                <div class="bot-tile"><div class="b-label">Account equity</div><div class="b-value">${priceCell(botStatus.equity)}</div></div>
              </div>`;
          }

          // ---------------- state ----------------'''

          pattern = re.compile(
              r'  async function fetchBotStatus\(\)\{.*?\n  // ---------------- state ----------------',
              re.S,
          )
          text, count = pattern.subn(lambda m: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one bot status block, replaced {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit dashboard upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Show forward-test bot brain on Wavelength Live"
          git push
