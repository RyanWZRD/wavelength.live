name: Market Workbench UI checks
on:
  pull_request:
    paths:
      - 'market-workbench.html'
      - 'market-workbench.js'
      - 'shared-nav.js'
      - '.github/workflows/market-workbench-ui-check.yml'
  push:
    branches: [main]
    paths:
      - 'market-workbench.html'
      - 'market-workbench.js'
      - 'shared-nav.js'
      - '.github/workflows/market-workbench-ui-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check market-workbench.js
      - name: Assert research-only wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('market-workbench.html').read_text()
          j=Path('market-workbench.js').read_text()
          n=Path('shared-nav.js').read_text()
          for token in ['Market Workbench','Historical reconstruction','Market change board','Research boundaries','RESEARCH ONLY']:
              assert token in h, token
          for feed in ['opportunity-radar.json','intelligence-history.json']:
              assert feed in j, feed
          assert 'coin.html?symbol=' in j
          assert 'market-workbench.html' in n
          forbidden=['submit_order','TradingClient','/v2/orders','automatic_promotion=true','live_money_enabled=true']
          for x in forbidden:
              assert x not in h and x not in j
          print('Market Workbench remains research-only')
          PY